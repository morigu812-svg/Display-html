<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Display HTML — ページのHTMLを表示</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131b2e;--line:#28344d;--text:#edf2ff;--muted:#9ba9c5;--accent:#8b9dff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#1b2850 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1050px;margin:auto;padding:48px 22px}.tag{display:inline-flex;align-items:center;gap:8px;color:#c4ceff;border:1px solid #3a4771;border-radius:999px;padding:5px 11px;font-size:12px;letter-spacing:.06em}
h1{font-size:clamp(32px,5vw,48px);line-height:1.12;margin:20px 0 12px;letter-spacing:-.04em}h1 span{color:var(--accent)}.lead{color:var(--muted);margin:0 0 28px}
.panel{background:rgba(19,27,46,.92);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 20px 70px #0003}
label{display:block;font-size:13px;font-weight:650;margin-bottom:9px}.inputrow{display:flex;gap:10px}
input{flex:1;min-width:0;background:#0b1222;color:var(--text);border:1px solid #34415d;border-radius:10px;padding:14px;font:inherit;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8b9dff22}
button{border:0;border-radius:10px;background:var(--accent);color:#10152c;font-weight:750;padding:0 20px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
.tools{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:17px 0 10px}.status{font-size:13px;color:var(--muted)}.smallbtn{background:#202b44;color:var(--text);padding:8px 12px;border:1px solid #34415d;font-size:13px}
.output{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#080d18}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:#111a2b;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}pre{margin:0;padding:18px;overflow:auto;max-height:65vh;white-space:pre;tab-size:2;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d6e0ff}
.note{font-size:12px;color:var(--muted);margin:16px 2px 0}.error{color:#ffb4b4}.foot{color:#657493;font-size:12px;margin-top:28px}
@media(max-width:580px){main{padding:30px 14px}.panel{padding:15px}.inputrow{flex-direction:column}button{padding:12px}.inputrow button{width:100%}}
</style>
</head>
<body><main>
<div class="tag"><span>◈</span> DEVELOPER TOOL</div>
<h1>Display <span>HTML</span></h1>
<p class="lead">URLを入力するだけ。ページのHTMLソースを取得して表示します。</p>
<section class="panel">
<form id="fetchForm">
<label for="url">ページのURL</label>
<div class="inputrow"><input id="url" type="url" placeholder="https://example.com" autocomplete="url" required><button id="fetchBtn" type="submit">HTMLを取得 ↗</button></div>
</form>
<div class="tools"><span id="status" class="status" aria-live="polite">URLを入力して取得を押してください。</span><button id="copyBtn" class="smallbtn" type="button" disabled>HTMLをコピー</button></div>
<div class="output"><div class="bar"><span id="fileLabel">SOURCE · HTML</span><span id="count">0 bytes</span></div><pre><code id="result">ここにHTMLソースが表示されます。</code></pre></div>
<p class="note">※ 外部サイトのHTML取得には公開プロキシを利用します。サイト側の制限、ログイン、JavaScriptによる後読み込みなどにより、取得できない場合や表示内容が実際のページと異なる場合があります。</p>
</section>
<p class="foot">DISPLAY HTML · ソース確認ツール</p>
</main>
<script>
const form=document.querySelector('#fetchForm'),urlInput=document.querySelector('#url'),btn=document.querySelector('#fetchBtn'),statusEl=document.querySelector('#status'),result=document.querySelector('#result'),count=document.querySelector('#count'),copyBtn=document.querySelector('#copyBtn'),fileLabel=document.querySelector('#fileLabel');
let source='';
function setStatus(text,error=false){statusEl.textContent=text;statusEl.className='status'+(error?' error':'')}
form.addEventListener('submit',async e=>{
 e.preventDefault();
 let target;
 try{target=new URL(urlInput.value.trim());if(!['http:','https:'].includes(target.protocol))throw new Error();}
 catch{setStatus('正しい http:// または https:// のURLを入力してください。',true);return;}
 btn.disabled=true;btn.textContent='取得中…';copyBtn.disabled=true;source='';result.textContent='HTMLを取得しています…';count.textContent='—';fileLabel.textContent=target.hostname;setStatus('ページに接続しています…');
 try{
  const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(target.href);
  const response=await fetch(proxy,{headers:{'Accept':'text/html,application/xhtml+xml,*/*'}});
  if(!response.ok)throw new Error('取得先から HTTP '+response.status+' が返されました。');
  source=await response.text();
  if(!source.trim())throw new Error('HTMLが空でした。サイト側の制限の可能性があります。');
  result.textContent=source;count.textContent=new TextEncoder().encode(source).length.toLocaleString()+' bytes';copyBtn.disabled=false;
  setStatus('取得成功 · '+source.length.toLocaleString()+' 文字');
 }catch(err){
  result.textContent='HTMLを取得できませんでした。\n\n'+(err.message||'ネットワークエラー')+'\n\n考えられる原因：\n・サイト側がプロキシからのアクセスを拒否している\n・対象サイトが一時的に停止している\n・公開プロキシが利用できない\n\n別のURLで試してください。';
  setStatus('取得に失敗しました。別のURLを試してください。',true);
 }finally{btn.disabled=false;btn.textContent='HTMLを取得 ↗';}
});
copyBtn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(source);setStatus('HTMLをクリップボードにコピーしました。');}catch{setStatus('コピーできませんでした。ブラウザの権限を確認してください。',true);}});
</script></body></html>
